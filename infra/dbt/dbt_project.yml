name: nowcpi
version: "1.0.0"
config-version: 2

profile: nowcpi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nowcpi:
    staging:
      +schema: staging
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
      +on_table_exists: drop
