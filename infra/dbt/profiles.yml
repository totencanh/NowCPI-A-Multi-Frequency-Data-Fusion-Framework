nowcpi:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: {{ env_var('TRINO_PORT', '8080') | int }}
      user: "{{ env_var('TRINO_USER', 'nowcpi') }}"
      database: delta
      schema: staging
      http_scheme: http
      threads: 4
