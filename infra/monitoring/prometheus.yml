global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: airflow_statsd
    static_configs:
      - targets: ["statsd-exporter:9102"]

  - job_name: nowcpi_pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: spark_bronze_stream
    scrape_interval: 5s
    static_configs:
      - targets: ["spark-bronze-streaming:9404"]
